name: Weekly AI Maintenance
on:
  workflow_call:
    inputs:
      custom_instructions:
        required: false
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  ai-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Führe die wöchentliche Wartung für dieses Repository durch:
            1. Prüfe veraltete Dependencies (`pnpm outdated`) und aktualisiere Patch/Minor-Updates sicher.
            2. Passe Code, Typen oder Docs an, falls sich etwas geändert hat.
            3. Führe `pnpm check` und `pnpm lint` aus und behebe eventuelle Fehler.
            4. Falls Änderungen am veröffentlichten Paketcode vorgenommen wurden, erstelle eine passende `.changeset/*.md`-Datei.
            5. Wenn keine sinnvollen Änderungen nötig sind, beende den Lauf ohne Commit.
            Zusatzhinweise: ${{ inputs.custom_instructions }}
          claude_args: "--max-turns 25"