name: Weekly AI Maintenance

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        required: false
        default: "22"
      auto_merge:
        type: boolean
        required: false
        default: true
      custom_instructions:
        type: string
        required: false
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      BOT_TOKEN:
        required: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Claude Code Maintenance
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.BOT_TOKEN }}
          claude_args: "--max-turns 35 --allowedTools Bash,Read,Write,Edit,Glob,Grep"
          prompt: |
            Lies zuerst `CLAUDE.md` (falls vorhanden), `package.json` sowie alle Dateien in `.github/workflows/`, um exakt zu sehen, welche CI-Checks in diesem Repo laufen (insbesondere Static Checks, Formatting, Linting, Typecheck, Tests und Build).

            Führe danach die wöchentliche Wartung durch:
            1. Prüfe veraltete Pakete mit `pnpm outdated` und aktualisiere Patch- und Minor-Updates (`pnpm update`).
            2. Passe Code, Formatierung, Typen oder Docs an, falls durch Updates neue Fehler oder Linter-Regeln greifen.
            3. Führe **alle** Befehle aus `package.json` und `.github/workflows/` aus, die auch im CI (`Static checks` etc.) laufen. Behebe jeden Fehler und wiederhole die Prüfungen so lange, bis alle Befehle mit Exit-Code 0 durchlaufen.
            4. Falls sich am veröffentlichten Paketcode (`src/`) oder an runtime `dependencies` etwas geändert hat, erstelle eine passende `.changeset/weekly-update.md` (meist `patch`). Bei reinen `devDependencies`-, Format- oder Docs-Updates KEIN Changeset anlegen.
            5. Erstelle KEINE Git-Commits oder Branches selbst – hinterlasse einfach die sauberen Dateiänderungen im Arbeitsverzeichnis.
            Zusatzanweisungen für dieses Repo: ${{ inputs.custom_instructions }}
            
      - name: Create or Update Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BOT_TOKEN }}
          branch: chore/weekly-ai-maintenance
          delete-branch: true
          commit-message: "chore(deps): weekly automated maintenance"
          title: "chore(deps): weekly automated maintenance"
          body: |
            Automatisiertes wöchentliches Update durch Claude Code:
            - Dependencies geprüft & aktualisiert
            - Typecheck, Lint, Tests und Build verifiziert
            - Changeset erstellt (falls Paket-Release erforderlich)
          labels: |
            automated
            dependencies

      - name: Enable GitHub Auto-Merge
        if: inputs.auto_merge && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash