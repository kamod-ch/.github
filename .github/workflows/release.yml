name: Release & Publish

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        required: false
        default: "22"
      publish_command:
        type: string
        required: false
        default: "pnpm changeset publish"
    secrets:
      BOT_TOKEN:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Für npm Trusted Publishing (OIDC) & Provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Create Release PR or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: ${{ inputs.publish_command }}
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Auto-merge Version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          gh pr merge "${{ steps.changesets.outputs.pullRequestNumber }}" --auto --squash